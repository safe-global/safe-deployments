name: Update Registry

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Safe version with deployment type'
        required: true
        type: choice
        options:
          - v1.3.0-canonical
          - v1.3.0-eip155
          - v1.3.0-both
          - v1.4.1
          - v1.5.0
      chain_id:
        description: 'Chain ID to add (e.g., 12345)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Safe version with deployment type'
        required: true
        type: string
      chain_id:
        description: 'Chain ID to add (e.g., 12345)'
        required: true
        type: string

permissions: {}

jobs:
  update-registry:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the branch ref and the signed commit via the API
      pull-requests: write # open the PR
      actions: write # dispatch the review.yml workflow for the new PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # SECURITY: keep the job's GITHUB_TOKEN out of .git/config. This job holds
          # contents/pull-requests/actions:write, and runs `pnpm install` + the
          # update-registry script before the PR step. With the default
          # (persist-credentials: true) the token is persisted in git config where a
          # compromised dependency install/build script could read it. We never push
          # over authenticated git anyway — the branch ref and signed commit are
          # created via the GitHub API, and the token is only exposed (as GH_TOKEN)
          # to the final "Create Pull Request" step. Do not remove.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          CHAIN_ID: ${{ inputs.chain_id }}
        run: |
          # Validate version format (alphanumeric, dots, and hyphens only)
          if ! [[ "$VERSION" =~ ^[a-zA-Z0-9.-]+$ ]]; then
            echo "ERROR: Invalid version format. Only alphanumeric, dots, and hyphens allowed."
            exit 1
          fi
          
          # Validate chain ID is numeric only
          if ! [[ "$CHAIN_ID" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid chain ID format. Must be numeric only."
            exit 1
          fi

      - name: Update registry
        env:
          VERSION: ${{ inputs.version }}
          CHAIN_ID: ${{ inputs.chain_id }}
        run: |
          if [ "$VERSION" = "v1.3.0-both" ]; then
            echo "Running for both v1.3.0 deployment types..."
            pnpm run update-registry \
              --version "v1.3.0-eip155" \
              --chainId "$CHAIN_ID" \
              --verbose
            pnpm run update-registry \
              --version "v1.3.0-canonical" \
              --chainId "$CHAIN_ID" \
              --verbose
          else
            pnpm run update-registry \
              --version "$VERSION" \
              --chainId "$CHAIN_ID" \
              --verbose
          fi

      - name: Format updated registry files
        run: pnpm run update-registry:lint

      - name: Check for changes
        id: check-changes
        # Scope to src/assets so only registry changes ever trigger a PR (the
        # update-registry script writes nowhere else); a stray file elsewhere must
        # never ride along in the automated, GitHub-signed commit.
        run: |
          if [ -n "$(git status --porcelain -- src/assets)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: create-pr
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHAIN_ID: ${{ inputs.chain_id }}
        # Creates a signed commit + PR via the GitHub API and outputs the PR number.
        # See bin/create-registry-pr.sh for the rationale (signed commits).
        run: bash ./bin/create-registry-pr.sh "$VERSION" "$CHAIN_ID"

      - name: Dispatch review workflow
        # A GITHUB_TOKEN PR does not fire pull_request, so review.yml is dispatched
        # explicitly. Best-effort: the PR is already created, so a dispatch failure
        # must not fail the workflow.
        if: steps.create-pr.outputs.pr_number != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pr_number }}
        run: gh workflow run review.yml -f pr_number="$PR_NUMBER"

